<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Minimalist rabbit head silhouette -->
  <g transform="translate(96, 88)">
    <!-- Ears -->
    <path d="M-20,-120 C-22,-160 -18,-175 -10,-175 C-2,-175 2,-160 0,-120" fill="white" opacity="0.95"/>
    <path d="M20,-120 C22,-160 18,-175 10,-175 C2,-175 -2,-160 0,-120" fill="white" opacity="0.95"/>
    <path d="M-16,-120 C-17,-150 -14,-162 -10,-162 C-6,-162 -3,-150 -2,-120" fill="#fbcfe8" opacity="0.6"/>
    <path d="M16,-120 C17,-150 14,-162 10,-162 C6,-162 3,-150 2,-120" fill="#fbcfe8" opacity="0.6"/>
    <!-- Head oval -->
    <ellipse cx="0" cy="-40" rx="48" ry="44" fill="white"/>
    <!-- Eyes -->
    <circle cx="-18" cy="-46" r="6" fill="#1f2937"/>
    <circle cx="-18" cy="-46" r="2" fill="white"/>
    <circle cx="18" cy="-46" r="6" fill="#1f2937"/>
    <circle cx="18" cy="-46" r="2" fill="white"/>
    <!-- Nose -->
    <path d="M-4,-34 L0,-30 L4,-34" fill="#fca5a5" stroke="#f87171" stroke-width="0.5" stroke-linejoin="round"/>
    <!-- Mouth -->
    <path d="M0,-30 Q-4,-26 0,-24 Q4,-26 0,-30" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="0" cy="24" rx="40" ry="28" fill="white"/>
    <!-- Book icon -->
    <rect x="-18" y="6" width="36" height="28" rx="3" fill="#fef3c7"/>
    <line x1="-10" y1="14" x2="-3" y2="14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="20" x2="-3" y2="20" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="14" x2="10" y2="14" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="20" x2="10" y2="20" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>