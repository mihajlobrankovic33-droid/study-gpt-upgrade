<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Rabbit body -->
  <g transform="translate(96, 96)">
    <!-- Ears -->
    <ellipse cx="-28" cy="-62" rx="10" ry="32" fill="white" opacity="0.95" transform="rotate(-15, -28, -62)"/>
    <ellipse cx="-28" cy="-62" rx="5" ry="24" fill="#fce7f3" opacity="0.8" transform="rotate(-15, -28, -62)"/>
    <ellipse cx="28" cy="-62" rx="10" ry="32" fill="white" opacity="0.95" transform="rotate(15, 28, -62)"/>
    <ellipse cx="28" cy="-62" rx="5" ry="24" fill="#fce7f3" opacity="0.8" transform="rotate(15, 28, -62)"/>
    <!-- Head -->
    <circle cx="0" cy="-20" r="36" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="-14" cy="-26" rx="6" ry="7" fill="#1f2937"/>
    <ellipse cx="-14" cy="-26" rx="3" ry="3.5" fill="white" opacity="0.7"/>
    <ellipse cx="14" cy="-26" rx="6" ry="7" fill="#1f2937"/>
    <ellipse cx="14" cy="-26" rx="3" ry="3.5" fill="white" opacity="0.7"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-14" rx="4" ry="3" fill="#fca5a5"/>
    <!-- Mouth -->
    <path d="M-4 -11 Q0 -7 4 -11" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-20" cy="-14" r="5" fill="#fce7f3" opacity="0.6"/>
    <circle cx="20" cy="-14" r="5" fill="#fce7f3" opacity="0.6"/>
    <!-- Whiskers -->
    <line x1="-28" y1="-16" x2="-44" y2="-20" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-28" y1="-12" x2="-44" y2="-12" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="-16" x2="44" y2="-20" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="-12" x2="44" y2="-12" stroke="#d1d5db" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Teeth -->
    <rect x="-3" y="-10" width="6" height="5" rx="1" fill="white" stroke="#d1d5db" stroke-width="0.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="30" ry="20" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
    <!-- Book in paws -->
    <rect x="-18" y="10" width="36" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="34" stroke="#d97706" stroke-width="1" opacity="0.5"/>
    <line x1="-12" y1="18" x2="-4" y2="18" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="24" x2="-4" y2="24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="18" x2="12" y2="18" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="24" x2="12" y2="24" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Paws -->
    <ellipse cx="-16" cy="28" rx="8" ry="5" fill="white" stroke="#d1d5db" stroke-width="1"/>
    <ellipse cx="16" cy="28" rx="8" ry="5" fill="white" stroke="#d1d5db" stroke-width="1"/>
  </g>
</svg>