<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Book -->
  <g transform="translate(100, 80)">
    <rect x="10" y="20" width="292" height="240" rx="20" fill="white" opacity="0.95"/>
    <rect x="10" y="20" width="292" height="240" rx="20" fill="none" stroke="#0d9488" stroke-width="4"/>
    <line x1="156" y1="28" x2="156" y2="252" stroke="#0d9488" stroke-width="4" opacity="0.5"/>
    <!-- Left page lines -->
    <line x1="36" y1="72" x2="136" y2="72" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="36" y1="108" x2="136" y2="108" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="36" y1="144" x2="136" y2="144" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="36" y1="180" x2="136" y2="180" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <!-- Right page lines -->
    <line x1="172" y1="72" x2="276" y2="72" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="108" x2="276" y2="108" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="144" x2="276" y2="144" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <line x1="172" y1="180" x2="276" y2="180" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Graduation cap -->
  <g transform="translate(260, 140)">
    <path d="M10 80 L10 40 L90 6 L170 40 L170 80 Z" fill="white" stroke="#0d9488" stroke-width="6" stroke-linejoin="round"/>
    <rect x="70" y="80" width="40" height="24" rx="6" fill="white" stroke="#0d9488" stroke-width="6"/>
    <line x1="90" y1="104" x2="90" y2="136" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <circle cx="90" cy="150" r="14" fill="#34d399" stroke="white" stroke-width="4"/>
  </g>
  <!-- "Study Buddy" text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="white" letter-spacing="2">Study Buddy</text>
</svg>