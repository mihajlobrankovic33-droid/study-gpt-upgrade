    <path d="M48,-210 C48,-278 32,-322 22,-322 C12,-322 2,-278 2,-210" fill="url(#ear)"/>
    <!-- Head -->
    <ellipse cx="0" cy="-92" rx="100" ry="92" fill="white" stroke="#e5e7eb" stroke-width="4"/>
    <!-- Eyes -->
    <ellipse cx="-36" cy="-105" rx="13" ry="14" fill="#1f2937"/>
    <ellipse cx="-36" cy="-105" rx="5" ry="5" fill="white" opacity="0.8"/>
    <ellipse cx="36" cy="-105" rx="13" ry="14" fill="#1f2937"/>
    <ellipse cx="36" cy="-105" rx="5" ry="5" fill="white" opacity="0.8"/>
