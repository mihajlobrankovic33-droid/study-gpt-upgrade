<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Rabbit body -->
  <g transform="translate(256, 256)">
    <!-- Ears -->
    <ellipse cx="-70" cy="-155" rx="28" ry="85" fill="white" opacity="0.95" transform="rotate(-15, -70, -155)"/>
    <ellipse cx="-70" cy="-155" rx="12" ry="65" fill="#fce7f3" opacity="0.8" transform="rotate(-15, -70, -155)"/>
    <ellipse cx="70" cy="-155" rx="28" ry="85" fill="white" opacity="0.95" transform="rotate(15, 70, -155)"/>
    <ellipse cx="70" cy="-155" rx="12" ry="65" fill="#fce7f3" opacity="0.8" transform="rotate(15, 70, -155)"/>
    <!-- Head -->
    <circle cx="0" cy="-50" r="95" fill="white" stroke="#d1d5db" stroke-width="4"/>
    <!-- Eyes -->
    <ellipse cx="-36" cy="-65" rx="16" ry="18" fill="#1f2937"/>
    <ellipse cx="-36" cy="-65" rx="8" ry="9" fill="white" opacity="0.7"/>
    <ellipse cx="36" cy="-65" rx="16" ry="18" fill="#1f2937"/>
    <ellipse cx="36" cy="-65" rx="8" ry="9" fill="white" opacity="0.7"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-35" rx="10" ry="8" fill="#fca5a5"/>
    <!-- Mouth -->
    <path d="M-10 -28 Q0 -18 10 -28" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-52" cy="-35" r="14" fill="#fce7f3" opacity="0.6"/>
    <circle cx="52" cy="-35" r="14" fill="#fce7f3" opacity="0.6"/>
    <!-- Whiskers -->
    <line x1="-72" y1="-40" x2="-116" y2="-50" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <line x1="-72" y1="-30" x2="-116" y2="-30" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <line x1="72" y1="-40" x2="116" y2="-50" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <line x1="72" y1="-30" x2="116" y2="-30" stroke="#d1d5db" stroke-width="4" stroke-linecap="round"/>
    <!-- Teeth -->
    <rect x="-8" y="-26" width="16" height="12" rx="2" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="75" rx="80" ry="55" fill="white" stroke="#d1d5db" stroke-width="4"/>
    <!-- Book in paws -->
    <rect x="-48" y="25" width="96" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <line x1="0" y1="30" x2="0" y2="90" stroke="#d97706" stroke-width="2.5" opacity="0.5"/>
    <line x1="-32" y1="45" x2="-10" y2="45" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="-32" y1="60" x2="-10" y2="60" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="45" x2="32" y2="45" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="60" x2="32" y2="60" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <!-- Paws -->
    <ellipse cx="-42" cy="70" rx="20" ry="12" fill="white" stroke="#d1d5db" stroke-width="2.5"/>
    <ellipse cx="42" cy="70" rx="20" ry="12" fill="white" stroke="#d1d5db" stroke-width="2.5"/>
  </g>
</svg>