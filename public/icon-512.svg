    <circle cx="58" cy="-78" r="10" fill="#fce7f3" opacity="0.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="48" rx="85" ry="58" fill="white" stroke="#e5e7eb" stroke-width="4"/>
    <!-- Book -->
    <g transform="translate(0, 10)">
      <rect x="-42" y="-6" width="84" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
      <line x1="0" y1="-3" x2="0" y2="55" stroke="#d97706" stroke-width="2.5" opacity="0.4"/>
      <line x1="-26" y1="10" x2="-8" y2="10" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="-26" y1="24" x2="-8" y2="24" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="-26" y1="38" x2="-8" y2="38" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="10" x2="26" y2="10" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="24" x2="26" y2="24" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="38" x2="26" y2="38" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
